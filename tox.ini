[tox]
min_version = 4.0
isolated_build = True
envlist =
    # Full catalogue of supported Python/PyTorch combinations, so that any of
    # them can be run with a bare `tox` or listed with `tox -l`.
    #
    # This list is independent of the CI matrix: the workflows select single
    # environments with `tox -e pyXY-torchZ` and never read `envlist`.
    py310-torch{260,270,271,280,290,291,2100,2110,2120,2121,2130,2140,2141},
    py311-torch{260,270,271,280,290,291,2100,2110,2120,2121,2130,2140,2141},
    py312-torch{260,270,271,280,290,291,2100,2110,2120,2121,2130,2140,2141},
    py313-torch{260,270,271,280,290,291,2100,2110,2120,2121,2130,2140,2141},
    py314-torch{290,291,2100,2110,2120,2121,2130,2140,2141},

[testenv]
setenv =
    PIP_EXTRA_INDEX_URL = {env:PIP_EXTRA_INDEX_URL:https://download.pytorch.org/whl/cpu}
deps =
    torch260:  torch==2.6.0
    torch270:  torch==2.7.0
    torch271:  torch==2.7.1
    torch280:  torch==2.8.0
    torch290:  torch==2.9.0
    torch291:  torch==2.9.1
    torch2100: torch==2.10.0
    torch2110: torch==2.11.0
    torch2120: torch==2.12.0
    torch2121: torch==2.12.1
    torch2130: torch==2.13.0
    torch2140: torch==2.14.0
    torch2141: torch==2.14.1
# Install the test dependencies as an extra of the package that tox builds
# (sdist) and installs itself. Listing `.[tox]` under `deps` would build the
# package a second time in the shared in-tree `build/` directory, which breaks
# parallel runs (`tox p`).
extras = tox
commands =
    pytest -vv {posargs: \
      -n logical \
      --random-order-bucket=global \
      --cov=tad_libcint \
      --cov-report=term-missing \
      --cov-report=xml:coverage.xml \
      test}
