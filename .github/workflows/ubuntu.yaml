name: Tests (Ubuntu)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "doc*/**"
      - "./*.ya?ml"
      - "**/*.md"
      - "**/*.rst"

  pull_request:
    paths-ignore:
      - "doc*/**"
      - "./*.ya?ml"
      - "**/*.md"
      - "**/*.rst"

  workflow_dispatch:

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Only the newest PyTorch release is tested against every Python
        # version. All other releases run on a single Python version each
        # (see the `include` block below). This is sufficient because the
        # package has no PyTorch-version-dependent code paths and released
        # wheels never change.
        #
        # To restore the full (dense) matrix: swap in the commented-out
        # `torch-version` list, delete the `include` block and uncomment the
        # `exclude` block.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        torch-version: ["2.14.1"]

        # python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # torch-version:
        #   [
        #     "2.6.0",
        #     "2.7.1",
        #     "2.8.0",
        #     "2.9.1",
        #     "2.10.0",
        #     "2.11.0",
        #     "2.12.1",
        #     "2.13.0",
        #     "2.14.1",
        #   ]

        include:
          # Every other PyTorch release runs on the newest Python version it
          # supports, which walks the staircase along the support boundary
          # (check the registry for the supported range:
          # https://download.pytorch.org/whl/torch/).
          #
          # 3.13/2.7.1 is also the combination the coverage report is taken
          # from, see the upload step below.
          - { os: ubuntu-latest, python-version: "3.13", torch-version: "2.6.0" }
          - { os: ubuntu-latest, python-version: "3.13", torch-version: "2.7.1" }
          - { os: ubuntu-latest, python-version: "3.13", torch-version: "2.8.0" }
          - { os: ubuntu-latest, python-version: "3.14", torch-version: "2.9.1" }
          - { os: ubuntu-latest, python-version: "3.14", torch-version: "2.10.0" }
          - { os: ubuntu-latest, python-version: "3.14", torch-version: "2.11.0" }
          - { os: ubuntu-latest, python-version: "3.14", torch-version: "2.12.1" }
          - { os: ubuntu-latest, python-version: "3.14", torch-version: "2.13.0" }

        # Only needed for the dense matrix above.
        #
        # PyTorch issues:
        # 3.13: https://github.com/pytorch/pytorch/issues/130249
        # 3.14: https://github.com/pytorch/pytorch/issues/156856
        #
        # exclude:
        #   # PyTorch<2.9.0 does only support Python<3.14
        #   - { python-version: "3.14", torch-version: "2.6.0" }
        #   - { python-version: "3.14", torch-version: "2.7.1" }
        #   - { python-version: "3.14", torch-version: "2.8.0" }

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Debug print
        run: |
          pwd
          ls -lcahF

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libblas-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install tox

      - name: Determine TOXENV
        run: echo "TOXENV=py$(echo ${{ matrix.python-version }} | tr -d '.')-torch$(echo ${{ matrix.torch-version }} | tr -d '.')" >> $GITHUB_ENV

      - name: Print TOXENV
        run: echo "TOXENV is set to '${TOXENV}'."
        env:
          TOXENV: ${{ env.TOXENV }}

      - name: Unittests with tox
        run: tox -e $TOXENV
        env:
          TOXENV: ${{ env.TOXENV }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: >
          matrix.python-version == '3.13' &&
          matrix.torch-version == '2.7.1' &&
          matrix.os == 'ubuntu-latest'
        with:
          name: coverage-data
          path: ./coverage.xml
          retention-days: 1 # temporarily needed to pass to next job

  # Dedicated job for upload
  upload_coverage:
    name: Upload to Codecov
    needs: main
    runs-on: ubuntu-latest
    environment: codecov
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@7f8b4b4bde536c465e797be725718b88c5d95e0e # 5.1.1
        with:
          files: ./coverage.xml # optional
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true # optional (default = false)
