[metadata]
name = tad_libcint
version = attr: tad_libcint._version.__version__
description = "Torch Autodiff Libcint Interface"
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/tad-mctc/tad-libcint/
author = "Marvin Friede"
author_email = friede@thch.uni-bonn.de
license = Apache-2.0
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: Implementation :: CPython
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Chemistry
    Topic :: Scientific/Engineering :: Mathematics
    Topic :: Scientific/Engineering :: Physics
    Typing :: Typed
keywords =
    tight-binding
    quantum-chemistry
    integrals
    library
project_urls =
    Documentation = https://github.com/tad-mctc/tad-libcint
    Tracker = https://github.com/tad-mctc/tad-libcint/issues
    Source Code = https://github.com/tad-mctc/tad-libcint
zip_safe = False

[options]
packages = find:
# On macOS, the libraries load PyTorch's libomp, which only exports all entry
# points that Apple's Clang emits since PyTorch 2.7 (`__kmpc_dispatch_deinit`).
install_requires =
    numpy
    tad-mctc>=0.10.0
    torch>=2.7,<3
python_requires = >=3.10, <3.15
package_dir =
    =src

[options.packages.find]
where = src

[options.extras_require]
dev =
    black
    covdefaults
    mypy
    pre-commit
    pylint
    pytest
    pytest-cov
    pytest-random-order
    pytest-xdist
    tox
    pyscf;platform_system != "Windows"
tox =
    covdefaults
    pytest
    pytest-cov
    pytest-random-order
    pytest-xdist
    pyscf;platform_system != "Windows"

[options.package_data]
tad_libcint =
    py.typed
    **/*.npy
    **/*.npz
